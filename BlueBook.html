  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #faf9f5;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    }

    #__bundler_loading {
      position: fixed;
      bottom: 20px;
      right: 20px;

      color: #666;
      background: #fff;
      padding: 8px 14px;
      border-radius: 8px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.12);
      z-index: 10000;

    #__bundler_thumbnail {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #faf9f5;
      z-index: 9999;
    }

    #__bundler_thumbnail svg {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    #__bundler_placeholder {
      color: #999;
      font-size: 14px;
    }
  </style>

  <script>

    document.addEventListener('DOMContentLoaded', async function () {
      const loading = document.getElementById('__bundler_loading');
      function setStatus(msg) { if (loading) loading.textContent = msg; }

      const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
      const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
      function toBase64(bytes) {
        let bin = '';
        for (let i = 0; i < bytes.length; i += 0x8000) {
          bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
        }
        return btoa(bin);
      }

      // Error sink persists across replaceWith since it's on window, not the DOM.
      window.addEventListener('error', function (e) {
        // Failed resource loads (CSP-blocked links, scripts, images) fire plain
        // events at the element — warn only; real JS errors carry message/error.
        if (!e.message && !e.error && e.target && e.target !== window) {
          console.warn('[bundle] resource failed to load:',
            e.target.tagName, String(e.target.src || e.target.href || ''));
          return;
        }
        var p = document.body || document.documentElement;
        var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
        d.id = '__bundler_err';
        d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
        d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
          '[bundle] ' + (e.message || e.type) +
          (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
      }, true);

      try {
        const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
        const templateEl = document.querySelector('script[type="__bundler/template"]');
        if (!manifestEl || !templateEl) {
          setStatus('Error: missing bundle data');
          console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
          return;
        }

        const manifest = JSON.parse(manifestEl.textContent);
        let template = JSON.parse(templateEl.textContent);

        // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
        // document's manifest; frame srcs carry an about:blank#<uuid> marker
        // instead of a substitutable uuid. Every document mints the blobs for
        // its OWN frames — from local text at the root, or text obtained from
        // its DIRECT parent over the relay protocol below — so each frame
        // navigation stays same-origin with its initiator and a deduped page
        // loads at any depth on any host, including a file:// download's
        // opaque origins (where a blob minted by one document cannot be
        // navigated to by another).
        const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
        const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
        const pageSet = new Set(pageOrder);
        const pageTexts = {};

        // ── Nested-page text protocol (parent-chain relay) ──
        // Page bundles ship once, in the ROOT document's manifest. Every
        // document mints the blobs for its OWN frames, obtaining page text
        // through a strict parent-chain relay: a document only ever SENDS to
        // its direct parent (which, for every document the publisher's own
        // runtime minted, is another publisher document) and only ACCEPTS
        // text from that direct parent; requests from below are honored only
        // for the document's own child frames, and the ROOT never sends
        // upward at all. That last rule is load-bearing: the artifact host's
        // frame-ancestors allows claude.ai (and friends) to frame an
        // artifact, so window.top can be a FOREIGN document — a top-addressed
        // protocol would hand page uuids to that ancestor and accept forged
        // "page text" from it, minting attacker HTML as an artifact-origin
        // blob document. The chain never touches the ancestor: requests stop
        // at the root, replies are origin-addressed per hop (never '*' when
        // an origin exists), and both directions are origin-gated (on https
        // a foreign sender's origin can never equal this document's; in
        // opaque contexts — file:// — everything serializes as 'null', where
        // an embedded EXTERNAL frame still fails the gate by carrying its
        // own real origin, and a sandboxed child of such a frame is excluded
        // by the own-child-frames check plus uuid unguessability). Shape is
        // deny-by-default: one request form, one reply form, no error
        // replies.
        // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
        // contexts such as a sandboxed preview iframe) — location.origin is
        // computed from the URL and stays 'https://…' even when the document
        // is sandboxed, which would misgate every opaque chain.
        const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
          ? window.origin
          : '*';
        function trustedOrigin(e) {
          if (e.origin === window.origin) return true; // https chains; opaque==opaque
          // file:// trees: Chrome serializes the file document's origin as
          // 'file://' while the blob: documents it mints serialize as 'null',
          // so the two legitimate shapes can never string-match — accept the
          // pair in both directions. https origins never serialize as either,
          // and sender identity (own child frame / direct parent) is checked
          // separately.
          return (
            (e.origin === 'null' &&
              (window.origin === 'file://' ||
                window.location.protocol === 'file:')) ||
            (/^file:/.test(e.origin) && window.origin === 'null')
          );
        }
        // Non-empty only in the root document (nested bundles ship an empty
        // island), so it doubles as the root marker: the root answers from
        // local text and treats a miss as authoritative — never relaying to
        // its (possibly foreign) parent.
        const isPageRoot = pageOrder.length > 0;
        const blobUrls = {};
        const resourceBlobs = {};
        const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
        const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
        const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
        function mountPage(el, frag, text) {
          const pageBlob = new Blob([text], { type: 'text/html' });
          const u = URL.createObjectURL(pageBlob);
          resourceBlobs[u] = pageBlob;
          el.src = u + frag;
        }
        function deliverPage(uuid, text) {
          const frames = pendingFrames[uuid];
          delete pendingFrames[uuid];
          if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
          const relays = pendingRelays[uuid];
          delete pendingRelays[uuid];
          if (relays) {
            for (const cw of relays) {
              try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
            }
          }
        }
        function ownFrameWindows() {
          const out = [];
          for (const f of Array.from(document.querySelectorAll('iframe'))) {
            try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
          }
          return out;
        }
        window.addEventListener('message', function (e) {
          const d = e.data;
          if (!d || typeof d !== 'object' || !e.source) return;
          // Origin gate first; the structural checks below (own-child-frames
          // for requests, direct-parent + solicited-uuid for replies, the
          // root's never-relay rule) are what hold in fully opaque chains
          // where origin strings can't discriminate — a sandboxed root's
          // FOREIGN wrapper still fails all three even though both serialize
          // as real-vs-'null' rather than matching.
          if (!trustedOrigin(e)) return;
          if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
            // Requests are honored only for this document's own child frames.
            if (ownFrameWindows().indexOf(e.source) < 0) return;
            const uuid = d.__bundler_need;
            const text = pageTexts[uuid];
            if (typeof text === 'string') {
              try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
              return;
            }
            if (isPageRoot || window.parent === window) return; // authoritative miss
            const waiting = pendingRelays[uuid];
            if (waiting) {
              if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
              return;
            }
            // Never-answered uuids would otherwise accumulate forever under a
            // request spray; past the cap (far above any real page count) new
            // relays are dropped rather than remembered.
            if (Object.keys(pendingRelays).length >= 128) return;
            pendingRelays[uuid] = [e.source];
            window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
          } else if (
            typeof d.__bundler_page === 'string' &&
            UUID_SHAPE.test(d.__bundler_page) &&
            typeof d.__bundler_text === 'string'
          ) {
            // The shape test is load-bearing beyond tidiness: the solicited
            // check below uses the in operator, which matches prototype keys
            // ('__proto__', 'constructor') — an unshaped key would reach
            // deliverPage and throw, painting the error banner.
            // Text is accepted only from the direct parent — the document
            // that minted this one.
            if (e.source !== window.parent || window.parent === window) return;
            if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
            deliverPage(d.__bundler_page, d.__bundler_text);
          }
        });

        const uuids = Object.keys(manifest);
        setStatus('Unpacking ' + uuids.length + ' assets...');

        await Promise.all(uuids.map(async (uuid) => {
          const entry = manifest[uuid];
          try {
            const binaryStr = atob(entry.data);
            const bytes = new Uint8Array(binaryStr.length);
            for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

            let finalBytes = bytes;
            if (entry.compressed) {
              if (typeof DecompressionStream !== 'undefined') {
                const ds = new DecompressionStream('gzip');
                const writer = ds.writable.getWriter();
                const reader = ds.readable.getReader();
                writer.write(bytes);
                writer.close();
                const chunks = [];
                let totalLen = 0;
                while (true) {
                  const { done, value } = await reader.read();
                  if (done) break;
                  chunks.push(value);
                  totalLen += value.length;
                }
                finalBytes = new Uint8Array(totalLen);
                let offset = 0;
                for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
              } else {
                console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
              }
            }

            if (pageSet.has(uuid)) {
              pageTexts[uuid] = new TextDecoder().decode(finalBytes);
              return;
            }
            if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
              // Strict artifact hosts allow font-src data: but not blob:.
              blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
                (entry.compressed ? toBase64(finalBytes) : entry.data);
            } else {
              const blob = new Blob([finalBytes], { type: entry.mime });
              blobUrls[uuid] = URL.createObjectURL(blob);
              resourceBlobs[blobUrls[uuid]] = blob;
            }
          } catch (err) {
            console.error('Failed to decode asset ' + uuid + ':', err);
            const blob = new Blob([], { type: entry.mime });
            blobUrls[uuid] = URL.createObjectURL(blob);
            resourceBlobs[blobUrls[uuid]] = blob;
          }
        }));

        const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
        const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
        const resourceMap = {};
        for (const entry of extResources) {
          if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
        }

        // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
        // consumers read these Blobs directly. Survives the swap like the error sink.
        window.__resourceBlobs = resourceBlobs;

        setStatus('Rendering...');
        // Page uuids have no blob here — they ride inside about:blank#<uuid>
        // frame markers the pass below resolves after the swap.
        for (const uuid of uuids) {
          if (pageSet.has(uuid)) continue;
          template = template.split(uuid).join(blobUrls[uuid]);
        }

        // Strip integrity + crossorigin — blob URLs from a file:// document inherit
        // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
        // The manifest bytes are ours; SRI protects against CDN compromise, not this.
        template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

        const resourceScript = '<script>window.__resources = ' +
          JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
          ';</' + 'script>';
        // Inject after <head> so the DOCTYPE stays first; prepending the script
        // would push the parser into quirks mode. DOMParser always emits a <head>
        // (synthesizing one if the source HTML omitted it) but may carry
        // attributes through, so match the full opening tag. slice() rather than
        // replace() keeps us clear of $-pattern substitution in resourceScript.
        const headOpen = template.match(/<head[^>]*>/i);
        if (headOpen) {
          const i = headOpen.index + headOpen[0].length;
          template = template.slice(0, i) + resourceScript + template.slice(i);
        }

        // Parse the template and swap the root element. Scripts inserted via
        // DOMParser/replaceWith are inert per spec — re-create each with
        // createElement so they execute, awaiting onload for src scripts to
        // preserve ordering (React before ReactDOM before Babel before text/babel).
        const doc = new DOMParser().parseFromString(template, 'text/html');
        document.documentElement.replaceWith(doc.documentElement);

        // Resolve page-frame markers: mint this document's own blob for each
        // framed page — from local text when this is the root, otherwise by
        // asking the direct parent over the relay protocol above. An
        // unanswered request leaves the frame on about:blank, the same
        // degraded state as a refused embed.
        {
          const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
          const needed = [];
          for (const el of Array.from(document.querySelectorAll('iframe'))) {
            const m = MARKER.exec(el.getAttribute('src') || '');
            if (!m) continue;
            const text = pageTexts[m[1]];
            if (typeof text === 'string') {
              mountPage(el, m[2] || '', text);
            } else if (window.parent !== window && !isPageRoot) {
              const had = pendingFrames[m[1]];
              (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
              if (!had) needed.push(m[1]);
            }
          }
          for (const uuid of needed) {
            window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
          }
        }

        const dead = Array.from(document.scripts);
        for (const old of dead) {
          const s = document.createElement('script');
          for (const a of old.attributes) s.setAttribute(a.name, a.value);
          s.textContent = old.textContent;
          // text/babel scripts with a src: read and inline. transformScriptTags
          // does XHR against the src, but blob:null/ from a file:// origin is
          // silently dropped. Inlining makes it a plain inline babel script,
          // which transformScriptTags handles unconditionally.
          if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
            const pre = resourceBlobs[s.src.split('#')[0]];
            s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
            s.removeAttribute('src');
          }
          const p = s.src ? new Promise(function (r) { s.onload = s.onerror = r; }) : null;
          old.replaceWith(s);
          if (p) await p;
        }
        // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
        // which fired before we swapped the document. Trigger manually if present.
        if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
          window.Babel.transformScriptTags();
        }
      } catch (err) {
        setStatus('Error unpacking: ' + err.message);
        console.error('Bundle unpack error:', err);
      }
    });

  </script>

nt-weight:700;font-size:20px;color:#fff;margin-bottom:10px;line-height:1.3;\">{{ selected.title }}<\u002Fdiv>\n      <div style=\"display:flex;align-items:center;gap:8px;margin-bottom:20px;flex-wrap:wrap;\">\n        <span style=\"font-size:11px;font-weight:700;padding:4px 10px;border-radius:6px;background:{{ selected.badgeBg }};color:{{ selected.badgeColor }};\">{{ selected.badgeLabel }}<\u002Fspan>\n        <span style=\"font-size:12.5px;color:#8A8DA0;\">{{ selected.dateLabel }} · {{ selected.sourceLabel }}<\u002Fspan>\n      <\u002Fdiv>\n      <div style=\"font-size:13.5px;color:#B4B4C6;line-height:1.6;margin-bottom:24px;\">{{ selected.description }}<\u002Fdiv>\n\n      <div style=\"font-size:11.5px;font-weight:700;color:#6B7986;letter-spacing:0.06em;margin-bottom:10px;\">SKILLS &amp; SUBJECTS<\u002Fdiv>\n      <div style=\"display:flex;gap:6px;flex-wrap:wrap;margin-bottom:24px;\">\n        <sc-for list=\"{{ selected.skills }}\" as=\"sk\" hint-placeholder-count=\"3\">\n          <span style=\"font-size:11.5px;color:#617CFF;background:rgba(97,124,255,0.1);border:1px solid rgba(97,124,255,0.2);padding:4px 10px;border-radius:7px;\">{{ sk.name }}<\u002Fspan>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <div style=\"font-size:11.5px;font-weight:700;color:#6B7986;letter-spacing:0.06em;margin-bottom:10px;\">EVIDENCE &amp; RESOURCES<\u002Fdiv>\n      <div style=\"display:flex;flex-direction:column;gap:8px;margin-bottom:24px;\">\n        <sc-for list=\"{{ selected.evidence }}\" as=\"ev\" hint-placeholder-count=\"2\">\n          <div style=\"display:flex;align-items:center;gap:10px;padding:10px 12px;background:rgba(255,255,255,0.03);border:1px solid rgba(255,255,255,0.06);border-radius:9px;\">\n            <svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#9090B0\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z\"><\u002Fpath><path d=\"M14 2v6h6\"><\u002Fpath><\u002Fsvg>\n            <span style=\"font-size:13px;color:#D4D4E0;\">{{ ev.label }}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n      <sc-if value=\"{{ selected.hasAspiration }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"font-size:11.5px;font-weight:700;color:#6B7986;letter-spacing:0.06em;margin-bottom:10px;\">CONNECTED ASPIRATION<\u002Fdiv>\n        <div style=\"font-size:13px;color:#5BB947;background:rgba(91,185,71,0.1);border:1px solid rgba(91,185,71,0.2);padding:10px 12px;border-radius:9px;margin-bottom:24px;\">{{ selected.aspirationText }}<\u002Fdiv>\n      <\u002Fsc-if>\n\n      <sc-if value=\"{{ selected.isVerified }}\" hint-placeholder-val=\"{{ false }}\">\n        <div style=\"font-size:12px;color:#6B7986;background:rgba(255,255,255,0.03);border:1px dashed rgba(255,255,255,0.1);padding:12px;border-radius:9px;\">This record is verified and issued by {{ selected.sourceLabel }}. It cannot be edited — you may add context or request a correction from the issuer.<\u002Fdiv>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ selected.isSelfDeclared }}\" hint-placeholder-val=\"{{ false }}\">\n        <div sc-camel-on-click=\"{{ requestVerification }}\" style=\"text-align:center;font-size:13px;font-weight:700;font-family:'Montserrat',sans-serif;color:#fff;background:#3355F6;padding:12px;border-radius:9px;cursor:pointer;\">Request verification<\u002Fdiv>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <sc-if value=\"{{ addModalOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div sc-camel-on-click=\"{{ closeAddModal }}\" style=\"position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:60;display:flex;align-items:center;justify-content:center;animation:bbFadeIn 0.15s ease;\">\n      <div sc-camel-on-click=\"{{ stopClick }}\" style=\"width:480px;max-width:92vw;background:#15161B;border:1px solid rgba(255,255,255,0.09);border-radius:16px;padding:28px;\">\n        <div style=\"display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;\">\n          <div style=\"font-family:'Montserrat',sans-serif;font-weight:700;font-size:17px;color:#fff;\">Add a self-declared record<\u002Fdiv>\n          <div sc-camel-on-click=\"{{ closeAddModal }}\" style=\"width:28px;height:28px;border-radius:8px;background:rgba(255,255,255,0.06);display:flex;align-items:center;justify-content:center;cursor:pointer;color:#9090B0;\">\n            <svg width=\"13\" height=\"13\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\"><path d=\"M18 6L6 18M6 6l12 12\"><\u002Fpath><\u002Fsvg>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:14px;\">\n          <div>\n            <div style=\"font-size:12px;color:#8A8DA0;margin-bottom:6px;\">Title<\u002Fdiv>\n            <input type=\"text\" placeholder=\"e.g. Summer research internship\" value=\"{{ formTitle }}\" sc-camel-on-change=\"{{ onFormTitleChange }}\" style=\"width:100%;height:40px;border-radius:9px;border:1px solid rgba(255,255,255,0.1);background:#0E0F13;color:#fff;font-size:13.5px;padding:0 12px;outline:none;\">\n          <\u002Fdiv>\n          <div>\n            <div style=\"font-size:12px;color:#8A8DA0;margin-bottom:6px;\">Category<\u002Fdiv>\n            <sc-raw-select value=\"{{ formCategory }}\" sc-camel-on-change=\"{{ onFormCategoryChange }}\" style=\"width:100%;height:40px;border-radius:9px;border:1px solid rgba(255,255,255,0.1);background:#0E0F13;color:#fff;font-size:13.5px;padding:0 12px;outline:none;\">\n              <option value=\"academic\">Academic<\u002Foption>\n              <option value=\"professional\">Professional<\u002Foption>\n              <option value=\"skillupgrade\">Skill Upgrade<\u002Foption>\n            <\u002Fsc-raw-select>\n          <\u002Fdiv>\n          <div>\n            <div style=\"font-size:12px;color:#8A8DA0;margin-bottom:6px;\">Description<\u002Fdiv>\n            <textarea placeholder=\"What did you do, learn, or achieve?\" value=\"{{ formDescription }}\" sc-camel-on-change=\"{{ onFormDescriptionChange }}\" style=\"width:100%;height:76px;border-radius:9px;border:1px solid rgba(255,255,255,0.1);background:#0E0F13;color:#fff;font-size:13.5px;padding:10px 12px;outline:none;resize:none;\"><\u002Ftextarea>\n          <\u002Fdiv>\n          <div sc-camel-on-click=\"{{ submitRecord }}\" style=\"text-align:center;margin-top:6px;font-size:13.5px;font-weight:700;font-family:'Montserrat',sans-serif;color:#fff;background:{{ submitStyle }};padding:12px;border-radius:9px;cursor:pointer;\">Save as self-declared record<\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = {\n    activeTab: 'all',\n    verifFilter: 'all',\n    searchQuery: '',\n    searchOpen: false,\n    selectedId: null,\n    addModalOpen: false,\n    privateRevealed: false,\n    formTitle: '',\n    formCategory: 'professional',\n    formDescription: ''\n  };\n\n  records = [\n    { id: 1, title: 'Class 10 Board Examination — Overall Result', category: 'academic', date: '2023-05-20', end: null, source: 'Central Board of Secondary Education', verification: 'verified', skills: ['Core Academics','Consistency'], evidence: ['Marksheet.pdf','Certificate.pdf'], description: 'Final result of the Class 10 board examination, including subject-wise marks and overall grade.', aspiration: null },\n    { id: 2, title: 'State-Level Robotics Competition — Finalist', category: 'professional', date: '2024-03-12', end: null, source: 'RoboFest India', verification: 'verified', skills: ['Robotics','Teamwork'], evidence: ['Award-certificate.pdf'], description: 'Reached the finals building an autonomous line-following robot with a 4-member team.', aspiration: 'Supports aspiration: Robotics Engineer' },\n    { id: 3, title: 'School Volunteering — Teaching Assistant', category: 'professional', date: '2024-08-01', end: '2024-10-01', source: 'Vidya Foundation', verification: 'verified', skills: ['Communication','Empathy'], evidence: ['Completion-letter.pdf'], description: 'Assisted underprivileged students with weekend mathematics tuition over two months.', aspiration: null },\n    { id: 4, title: 'Chemistry Practical Assessment', category: 'academic', date: '2024-09-15', end: null, source: 'Greenwood Sr. Secondary School', verification: 'verified', skills: ['Lab Techniques'], evidence: ['Assessment-report.pdf'], description: 'Term practical assessment covering titration and qualitative analysis techniques.', aspiration: null },\n    { id: 5, title: 'Python for Data Science', category: 'skillupgrade', date: '2024-11-01', end: null, source: 'Udemy', verification: 'self-declared', skills: ['Python','Data Wrangling'], evidence: ['Course-certificate.pdf'], description: 'Self-paced course covering pandas, numpy, and exploratory data analysis.', aspiration: 'Supports aspiration: Data Analyst' },\n    { id: 6, title: 'Advanced Mathematics Certificate', category: 'academic', date: '2025-06-02', end: null, source: 'Greenwood Sr. Secondary School', verification: 'verified', skills: ['Calculus','Analytical Reasoning'], evidence: ['Certificate.pdf'], description: 'Certificate of excellence for advanced mathematics coursework in Grade 11.', aspiration: null },\n    { id: 7, title: 'Robotics Club — Team Lead', category: 'professional', date: '2025-01-10', end: '2025-12-01', source: 'Self-declared', verification: 'self-declared', skills: ['Leadership','Robotics'], evidence: ['Project-photos.zip','Demo-video.mp4'], description: 'Led a 6-member robotics club, coordinating builds and representing the team at events.', aspiration: 'Supports aspiration: Robotics Engineer' },\n    { id: 8, title: 'Public Speaking Micro-credential', category: 'skillupgrade', date: '2025-04-18', end: null, source: 'Toastmasters', verification: 'verified', skills: ['Public Speaking'], evidence: ['Micro-credential.pdf'], description: 'Completed a structured 8-session public speaking and communication program.', aspiration: null },\n    { id: 9, title: 'UI/UX Design Bootcamp', category: 'skillupgrade', date: '2025-09-05', end: '2025-10-20', source: 'Springboard', verification: 'self-declared', skills: ['Design Thinking','Figma'], evidence: ['Portfolio-link'], description: 'Six-week intensive bootcamp covering user research, wireframing, and prototyping.', aspiration: 'Supports aspiration: Data Analyst' },\n    { id: 10, title: 'Physics — Semester 3 Grade Report', category: 'academic', date: '2025-11-10', end: null, source: 'Greenwood Sr. Secondary School', verification: 'verified', skills: ['Applied Physics','Problem Solving'], evidence: ['Marksheet.pdf'], description: 'Semester grade report covering mechanics and thermodynamics units.', aspiration: null },\n    { id: 11, title: 'Introduction to Machine Learning', category: 'skillupgrade', date: '2026-02-20', end: null, source: 'Coursera', verification: 'self-declared', skills: ['Machine Learning','Python'], evidence: ['Course-certificate.pdf'], description: 'Foundational course on supervised learning, covering regression and classification.', aspiration: 'Supports aspiration: Data Analyst' },\n    { id: 12, title: 'Summer Data Analytics Internship', category: 'professional', date: '2026-05-01', end: '2026-07-15', source: 'Nimbus Analytics', verification: 'self-declared', skills: ['Data Analysis','SQL','Communication'], evidence: ['Project-report.pdf','Github-repo-link'], description: 'Built dashboards and cleaned datasets for a marketing analytics team over the summer.', aspiration: 'Supports aspiration: Data Analyst' },\n    { id: 13, title: 'Family Context Note', category: 'private', date: '2024-01-01', end: null, source: 'Self-added', verification: 'self-declared', skills: [], evidence: ['Note.pdf'], description: 'Voluntary context on family academic background, kept private by default.', aspiration: null },\n    { id: 14, title: 'Counselor Session Notes — Career Direction', category: 'private', date: '2025-12-05', end: null, source: 'Ms. Anjali Rao (Counselor)', verification: 'assessed', skills: ['Self-awareness'], evidence: ['Session-notes.pdf'], description: 'Notes from a guided conversation exploring career direction and interest alignment.', aspiration: null },\n    { id: 15, title: 'Aptitude & Career Interest Assessment', category: 'private', date: '2026-01-15', end: null, source: 'RSA Psychometric Panel', verification: 'assessed', skills: ['Aptitude'], evidence: ['Assessment-report.pdf'], description: 'Standardised aptitude and interest inventory administered under RSA guidelines.', aspiration: null },\n    { id: 16, title: 'Entrance Exam Mock Result — JEE Mock 4', category: 'private', date: '2026-03-02', end: null, source: 'Prep Institute', verification: 'assessed', skills: ['Test Readiness'], evidence: ['Mock-result.pdf'], description: 'Fourth full-length mock test result with subject-wise percentile breakdown.', aspiration: null }\n  ];\n  nextId = 17;\n\n  monthShort = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];\n\n  formatDate(rec) {\n    const d = new Date(rec.date);\n    const start = this.monthShort[d.getMonth()] + ' ' + d.getFullYear();\n    if (!rec.end) return start;\n    const de = new Date(rec.end);\n    return start + ' – ' + this.monthShort[de.getMonth()] + ' ' + de.getFullYear();\n  }\n\n  badgeFor(rec) {\n    if (rec.verification === 'verified') return { label: 'Verified · ' + rec.source, bg: 'rgba(0,176,178,0.14)', color: '#00DCDF' };\n    if (rec.verification === 'assessed') return { label: 'Assessed', bg: 'rgba(233,200,110,0.14)', color: '#E9C86E' };\n    return { label: 'Self-declared', bg: 'rgba(144,144,176,0.16)', color: '#9090B0' };\n  }\n\n  categoryLabel(cat) {\n    return { academic: 'Academic', professional: 'Professional', skillupgrade: 'Skill Upgrade', private: 'Private' }[cat] || cat;\n  }\n\n  buildRow(rec, selectedId) {\n    const badge = this.badgeFor(rec);\n    const isSelected = rec.id === selectedId;\n    return {\n      id: rec.id,\n      title: rec.title,\n      dateLabel: this.formatDate(rec),\n      sourceLabel: rec.source,\n      badgeLabel: badge.label, badgeBg: badge.bg, badgeColor: badge.color,\n      isAcademic: rec.category === 'academic',\n      isProfessional: rec.category === 'professional',\n      isSkillUpgrade: rec.category === 'skillupgrade',\n      isPrivate: rec.category === 'private',\n      skills: rec.skills.slice(0, 3).map(s => ({ name: s })),\n      evidenceLabel: rec.evidence.length + (rec.evidence.length === 1 ? ' attachment' : ' attachments'),\n      onOpen: () => this.setState({ selectedId: rec.id }),\n      rowStyle: {\n        display: 'flex', alignItems: 'center', gap: '14px', padding: '14px 16px', borderRadius: '12px', cursor: 'pointer',\n        background: isSelected ? 'rgba(51,85,246,0.1)' : '#15161B',\n        border: isSelected ? '1px solid rgba(51,85,246,0.4)' : '1px solid rgba(255,255,255,0.06)'\n      }\n    };\n  }\n\n  matchesSearch(rec, q) {\n    if (!q) return true;\n    const s = q.toLowerCase();\n    return rec.title.toLowerCase().includes(s) || rec.source.toLowerCase().includes(s) || rec.skills.some(sk => sk.toLowerCase().includes(s));\n  }\n\n  renderVals() {\n    const st = this.state;\n    const tabDefs = [\n      { key: 'all', label: 'All Activity' },\n      { key: 'academic', label: 'Academic' },\n      { key: 'professional', label: 'Professional' },\n      { key: 'skillupgrade', label: 'Skill Upgrades' },\n      { key: 'private', label: 'Private', isPrivate: true }\n    ];\n    const tabs = tabDefs.map(t => {\n      const active = st.activeTab === t.key;\n      return {\n        key: t.key, label: t.label, isPrivate: !!t.isPrivate,\n        onClick: () => this.setState({ activeTab: t.key }),\n        style: {\n          padding: '9px 16px', borderRadius: '8px', fontSize: '13px', fontWeight: 600, fontFamily: 'Montserrat, sans-serif', cursor: 'pointer',\n          background: active ? '#3355F6' : 'transparent',\n          color: active ? '#fff' : '#9090B0'\n        }\n      };\n    });\n\n    const verifDefs = [\n      { key: 'all', label: 'All' },\n      { key: 'verified', label: 'Verified' },\n      { key: 'self-declared', label: 'Self-declared' }\n    ];\n    const verifFilters = verifDefs.map(v => {\n      const active = st.verifFilter === v.key;\n      return {\n        key: v.key, label: v.label,\n        onClick: () => this.setState({ verifFilter: v.key }),\n        style: {\n          padding: '6px 12px', borderRadius: '7px', fontSize: '12px', fontWeight: 600, cursor: 'pointer',\n          background: active ? 'rgba(97,124,255,0.15)' : 'transparent',\n          color: active ? '#617CFF' : '#8A8DA0',\n          border: active ? '1px solid rgba(97,124,255,0.3)' : '1px solid rgba(255,255,255,0.07)'\n        }\n      };\n    });\n\n    const activeTabIsPrivate = st.activeTab === 'private';\n    const showPrivateGate = activeTabIsPrivate && !st.privateRevealed;\n    const showTimeline = !showPrivateGate;\n\n    let filtered = this.records.filter(r => {\n      if (st.activeTab === 'all') return r.category !== 'private';\n      return r.category === st.activeTab;\n    });\n    if (st.verifFilter === 'verified') filtered = filtered.filter(r => r.verification === 'verified');\n    if (st.verifFilter === 'self-declared') filtered = filtered.filter(r => r.verification !== 'verified');\n    filtered = filtered.filter(r => this.matchesSearch(r, st.searchQuery));\n    filtered.sort((a, b) => new Date(b.date) - new Date(a.date));\n\n    const yearMap = {};\n    filtered.forEach(r => {\n      const y = new Date(r.date).getFullYear();\n      if (!yearMap[y]) yearMap[y] = [];\n      yearMap[y].push(r);\n    });\n    const groups = Object.keys(yearMap).sort((a, b) => b - a).map(y => ({\n      year: y, items: yearMap[y].map(r => this.buildRow(r, st.selectedId))\n    }));\n\n    const searchActive = st.searchOpen && st.searchQuery.trim().length > 0;\n    const searchMatches = searchActive ? this.records.filter(r => (st.privateRevealed || r.category !== 'private') && this.matchesSearch(r, st.searchQuery)).slice(0, 6) : [];\n    const searchResults = searchMatches.map(r => {\n      const badge = this.badgeFor(r);\n      return {\n        id: r.id, title: r.title, categoryLabel: this.categoryLabel(r.category), dateLabel: this.formatDate(r),\n        badgeLabel: badge.label, badgeBg: badge.bg, badgeColor: badge.color,\n        onSelect: () => this.setState({ activeTab: r.category, selectedId: r.id, searchOpen: false, searchQuery: '', privateRevealed: r.category === 'private' ? true : st.privateRevealed })\n      };\n    });\n\n    let selected = null;\n    if (st.selectedId) {\n      const rec = this.records.find(r => r.id === st.selectedId);\n      if (rec) {\n        const badge = this.badgeFor(rec);\n        selected = {\n          title: rec.title, categoryLabel: this.categoryLabel(rec.category), dateLabel: this.formatDate(rec), sourceLabel: rec.source,\n          badgeLabel: badge.label, badgeBg: badge.bg, badgeColor: badge.color,\n          description: rec.description,\n          skills: rec.skills.map(s => ({ name: s })),\n          evidence: rec.evidence.map(e => ({ label: e })),\n          hasAspiration: !!rec.aspiration, aspirationText: rec.aspiration || '',\n          isVerified: rec.verification === 'verified',\n          isSelfDeclared: rec.verification !== 'verified'\n        };\n      }\n    }\n\n    const canSubmit = st.formTitle.trim().length > 0;\n\n    return {\n      tabs, verifFilters,\n      showPrivateGate, showTimeline, activeTabIsPrivate,\n      groups, hasGroups: groups.length > 0, hasNoGroups: groups.length === 0,\n      resultsCountLabel: filtered.length + (filtered.length === 1 ? ' record' : ' records'),\n      searchQuery: st.searchQuery,\n      searchOpen: searchActive,\n      hasSearchResults: searchResults.length > 0,\n      hasNoSearchResults: searchResults.length === 0,\n      searchResults,\n      onSearchChange: (e) => this.setState({ searchQuery: e.target.value, searchOpen: true }),\n      onSearchFocus: () => { if (st.searchQuery.trim()) this.setState({ searchOpen: true }); },\n      revealPrivate: () => this.setState({ privateRevealed: true }),\n      drawerOpen: !!selected,\n      selected: selected || {},\n      closeDrawer: () => this.setState({ selectedId: null }),\n      requestVerification: () => this.setState({ selectedId: null }),\n      openAddModal: () => this.setState({ addModalOpen: true, formTitle: '', formCategory: st.activeTab === 'academic' || st.activeTab === 'skillupgrade' ? st.activeTab : 'professional', formDescription: '' }),\n      closeAddModal: () => this.setState({ addModalOpen: false }),\n      addModalOpen: st.addModalOpen,\n      stopClick: (e) => e.stopPropagation(),\n      formTitle: st.formTitle,\n      formCategory: st.formCategory,\n      formDescription: st.formDescription,\n      onFormTitleChange: (e) => this.setState({ formTitle: e.target.value }),\n      onFormCategoryChange: (e) => this.setState({ formCategory: e.target.value }),\n      onFormDescriptionChange: (e) => this.setState({ formDescription: e.target.value }),\n      submitStyle: canSubmit ? '#3355F6' : '#2A2C33',\n      submitRecord: () => {\n        if (!canSubmit) return;\n        const cat = st.formCategory;\n        this.records.push({\n          id: this.nextId++, title: st.formTitle.trim(), category: cat, date: new Date().toISOString().slice(0, 10), end: null,\n          source: 'Self-declared', verification: 'self-declared', skills: [], evidence: [],\n          description: st.formDescription.trim() || 'No additional description provided.', aspiration: null\n        });\n        this.setState({ addModalOpen: false, activeTab: cat, formTitle: '', formDescription: '' });\n      }\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
